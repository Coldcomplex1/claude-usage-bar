<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="p-wrap">
      <div class="p-head">
        <span class="p-title">Claude Usage</span>
      </div>

      <div id="rows" class="p-rows"><div class="p-empty">Loading…</div></div>

      <div class="p-show">
        <span class="p-show-label">Show in bar</span>
        <div class="p-chks">
          <label class="p-chk"><input type="checkbox" data-show="session" /><span>Session</span></label>
          <label class="p-chk"><input type="checkbox" data-show="allModels" /><span>All models</span></label>
        </div>
      </div>

      <div class="p-foot">
        <span id="status" class="p-status">…</span>
        <div class="p-actions">
          <button id="settings" class="p-btn">Settings</button>
          <button id="refresh" class="p-btn">Refresh</button>
        </div>
      </div>
    </div>

    <script src="usage.js"></script>
    <script src="session.js"></script>
    <script src="estimate.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
